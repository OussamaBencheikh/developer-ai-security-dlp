services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dlp
      POSTGRES_PASSWORD: dlp
      POSTGRES_DB: dlp
    ports:
      - "5432:5432"
    volumes:
      - dlp-postgres:/var/lib/postgresql/data
      - ../database/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro

volumes:
  dlp-postgres:
