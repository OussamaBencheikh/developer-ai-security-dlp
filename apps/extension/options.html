<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Security DLP Settings</title></head><body><main><h1>Privacy-first protection</h1><p>Scanning happens locally in this extension. Raw prompts and detected values are not sent to our backend.</p><form id="policy-form"><fieldset><legend>Policy actions</legend><label>Critical <select name="critical"><option value="block">Block</option><option value="warn">Warn</option><option value="allow">Allow</option></select></label><label>High <select name="high"><option value="block">Block</option><option value="warn">Warn</option><option value="allow">Allow</option></select></label><label>Medium <select name="medium"><option value="block">Block</option><option value="warn">Warn</option><option value="allow">Allow</option></select></label><label>Low <select name="low"><option value="block">Block</option><option value="warn">Warn</option><option value="allow">Allow</option></select></label></fieldset><button type="submit">Save policy</button><p id="saved" role="status" aria-live="polite"></p></form></main><script src="options.js"></script></body></html>
